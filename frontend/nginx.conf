server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # REST API -> backend container (same origin for the browser, no CORS needed)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HLS playlists and video segments are served by the backend
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Hashed build assets never change, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths are handled by React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
