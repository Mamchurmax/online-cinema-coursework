name: online-cinema

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cinema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinema}
      POSTGRES_DB: ${POSTGRES_DB:-cinema}
      # Ukrainian collation (ICU): ORDER BY puts "І", "Є", "Ї", "Ґ" in alphabetical
      # order instead of by code point. Applied only when the volume is first created.
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=uk-UA
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the Compose network the database host is "db", not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cinema}:${POSTGRES_PASSWORD:-cinema}@db:5432/${POSTGRES_DB:-cinema}
      MEDIA_ROOT: /media
    volumes:
      # Source videos and generated HLS files (not in git, see .gitignore).
      - ./media:/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

  # Database browser for screenshots and debugging; starts only with the "tools" profile:
  #   docker compose --profile tools up -d adminer  ->  http://localhost:8080
  adminer:
    image: adminer:5.3.0
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - db

volumes:
  pgdata:
